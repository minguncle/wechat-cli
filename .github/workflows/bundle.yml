name: Verify offline Skill build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: python scripts/build_bundle.py --prepare --version 0.2.0a7
      # Complete native-library source/license materials before distributing runtimes.
      - run: echo "Build verified locally on this runner; runtime archives are not uploaded."
